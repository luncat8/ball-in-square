<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>square1 / hole1 / ball</title>
<style>
	html, body {
		margin: 0;
		height: 100%;
		background: #0b0e14;
		color: #c3cde0;
		font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
	}
	#wrap {
		box-sizing: border-box;
		height: 100%;
		padding: 10px;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 10px;
	}
	#bar {
		display: flex;
		gap: 20px;
		align-items: center;
		flex-wrap: wrap;
		justify-content: center;
	}
	label {
		display: flex;
		gap: 7px;
		align-items: center;
		cursor: pointer;
		user-select: none;
	}
	#hint {
		opacity: 0.65;
	}
	#stage {
		flex: 1 1 auto;
		min-height: 0;
		width: 100%;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	canvas {
		background: #0e1118;
		border: 1px solid #232b3a;
		display: block;
	}
	#stats {
		opacity: 0.8;
		white-space: pre;
		text-align: center;
	}
</style>
</head>
<body>
<div id="wrap">
	<div id="bar">
		<label><input type="checkbox" id="spin"> square1 free rotation</label>
		<span id="hint">off: rotation locked (spin energy absorbed), free translation</span>
	</div>
	<div id="stage"><canvas id="c"></canvas></div>
	<div id="stats"></div>
</div>
<script>
"use strict";

const W = 1024;
const H = 1024;
const SQ = 200;
const HOLE = 100;
const SQ_MASS = 1;
const BALL_R = 5;
const BALL_MASS = 1;
const INERTIA = SQ_MASS * (SQ * SQ + HOLE * HOLE) / 6;
const LIMIT = HOLE / 2 - BALL_R;
const TAU = Math.PI * 2;
const DT = 1 / 600;
const MAX_SUB = 64;

const sq = { x: W / 2, y: H / 2, vx: 42, vy: 26, a: 0, va: 0 };
const ball = { lx: 0, ly: 0, vx: 236, vy: 158 };

let freeRot = false;
let scale = 1;
let acc = 0;
let last = 0;
let ticks = 0;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const stats = document.getElementById("stats");
const toggle = document.getElementById("spin");
const hint = document.getElementById("hint");
const scratch = { x: 0, y: 0 };

function wrap(v, m) {
	v = v % m;
	return v < 0 ? v + m : v;
}

function fit() {
	const box = canvas.parentElement.getBoundingClientRect();
	const avail = Math.max(64, Math.floor(Math.min(box.width, box.height)));
	const dpr = Math.min(window.devicePixelRatio || 1, 2);
	const px = Math.max(64, Math.round(avail * dpr));
	canvas.style.width = px / dpr + "px";
	canvas.style.height = px / dpr + "px";
	canvas.width = px;
	canvas.height = px;
	scale = px / W;
}

function advance(lx, ly, kx, ky, omega, t) {
	const px = lx + kx * t;
	const py = ly + ky * t;
	const p = -omega * t;
	const cp = Math.cos(p);
	const sp = Math.sin(p);
	scratch.x = cp * px - sp * py;
	scratch.y = sp * px + cp * py;
}

function clampInto() {
	if (ball.lx > LIMIT) ball.lx = LIMIT;
	else if (ball.lx < -LIMIT) ball.lx = -LIMIT;
	if (ball.ly > LIMIT) ball.ly = LIMIT;
	else if (ball.ly < -LIMIT) ball.ly = -LIMIT;
}

function collide(nx, ny) {
	const c = Math.cos(sq.a);
	const s = Math.sin(sq.a);
	const nwx = nx * c - ny * s;
	const nwy = nx * s + ny * c;
	const rx = ball.lx * c - ball.ly * s;
	const ry = ball.lx * s + ball.ly * c;
	const ux = sq.vx - sq.va * ry;
	const uy = sq.vy + sq.va * rx;
	const vrx = ball.vx - ux;
	const vry = ball.vy - uy;
	const vn = vrx * nwx + vry * nwy;
	if (vn >= 0) return false;
	const rn = rx * nwy - ry * nwx;
	let denom = 1 / BALL_MASS + 1 / SQ_MASS;
	if (freeRot) denom += (rn * rn) / INERTIA;
	const j = (-2 * vn) / denom;
	ball.vx += (j * nwx) / BALL_MASS;
	ball.vy += (j * nwy) / BALL_MASS;
	sq.vx -= (j * nwx) / SQ_MASS;
	sq.vy -= (j * nwy) / SQ_MASS;
	if (freeRot) sq.va -= (j * rn) / INERTIA;
	return true;
}

function translate(t, kx, ky) {
	sq.x = wrap(sq.x + sq.vx * t, W);
	sq.y = wrap(sq.y + sq.vy * t, H);
	sq.a += sq.va * t;
	if (sq.a > Math.PI) sq.a -= TAU;
	else if (sq.a < -Math.PI) sq.a += TAU;
	advance(ball.lx, ball.ly, kx, ky, sq.va, t);
	ball.lx = scratch.x;
	ball.ly = scratch.y;
}

function outsideAt(kx, ky, omega, t) {
	advance(ball.lx, ball.ly, kx, ky, omega, t);
	return scratch.x > LIMIT || scratch.x < -LIMIT || scratch.y > LIMIT || scratch.y < -LIMIT;
}

function contactTime(kx, ky, omega, left) {
	if (!outsideAt(kx, ky, omega, left)) return -1;
	let lo = 0;
	let hi = left;
	for (let i = 0; i < 24; i++) {
		const mid = 0.5 * (lo + hi);
		if (outsideAt(kx, ky, omega, mid)) hi = mid;
		else lo = mid;
	}
	return hi;
}

function step(dt) {
	let left = dt;
	let guard = 0;
	while (left > 1e-12 && guard++ < MAX_SUB) {
		const c = Math.cos(sq.a);
		const s = Math.sin(sq.a);
		const rvx = ball.vx - sq.vx;
		const rvy = ball.vy - sq.vy;
		const kx = rvx * c + rvy * s;
		const ky = -rvx * s + rvy * c;
		const tc = contactTime(kx, ky, sq.va, left);
		if (tc < 0) {
			translate(left, kx, ky);
			break;
		}
		translate(tc, kx, ky);
		left -= tc;
		clampInto();
		const nx = Math.abs(ball.lx) >= Math.abs(ball.ly)
			? (ball.lx > 0 ? -1 : 1)
			: 0;
		const ny = nx === 0 ? (ball.ly > 0 ? -1 : 1) : 0;
		if (!collide(nx, ny) && tc <= 0) {
			translate(left, kx, ky);
			left = 0;
		}
	}
	clampInto();
	if (!freeRot) sq.va = 0;
	ticks++;
}

function energy() {
	const b = ball.vx * ball.vx + ball.vy * ball.vy;
	const s = sq.vx * sq.vx + sq.vy * sq.vy;
	return 0.5 * BALL_MASS * b + 0.5 * SQ_MASS * s + 0.5 * INERTIA * sq.va * sq.va;
}

function offsets(cx, cy, rad) {
	const out = [];
	for (let i = -1; i <= 1; i++) {
		for (let j = -1; j <= 1; j++) {
			const dx = i * W;
			const dy = j * H;
			if (cx + rad + dx < 0 || cx - rad + dx > W) continue;
			if (cy + rad + dy < 0 || cy - rad + dy > H) continue;
			out.push(dx, dy);
		}
	}
	return out;
}

function draw() {
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	ctx.clearRect(0, 0, canvas.width, canvas.height);
	ctx.setTransform(scale, 0, 0, scale, 0, 0);

	ctx.lineWidth = 1;
	ctx.strokeStyle = "#1a2130";
	ctx.beginPath();
	for (let i = 128; i < W; i += 128) {
		ctx.moveTo(i + 0.5, 0);
		ctx.lineTo(i + 0.5, H);
		ctx.moveTo(0, i + 0.5);
		ctx.lineTo(W, i + 0.5);
	}
	ctx.stroke();

	const sx = wrap(sq.x, W);
	const sy = wrap(sq.y, H);
	const c = Math.cos(sq.a);
	const s = Math.sin(sq.a);
	const bx = wrap(sq.x + ball.lx * c - ball.ly * s, W);
	const by = wrap(sq.y + ball.lx * s + ball.ly * c, H);

	const so = offsets(sx, sy, SQ * 0.70710678);
	for (let i = 0; i < so.length; i += 2) {
		ctx.save();
		ctx.translate(sx + so[i], sy + so[i + 1]);
		ctx.rotate(sq.a);
		ctx.beginPath();
		ctx.rect(-SQ / 2, -SQ / 2, SQ, SQ);
		ctx.rect(-HOLE / 2, -HOLE / 2, HOLE, HOLE);
		ctx.fillStyle = "#28405e";
		ctx.fill("evenodd");
		ctx.lineWidth = 2;
		ctx.strokeStyle = "#6ea8ff";
		ctx.strokeRect(-SQ / 2, -SQ / 2, SQ, SQ);
		ctx.lineWidth = 2;
		ctx.strokeStyle = "#ffb86c";
		ctx.strokeRect(-HOLE / 2, -HOLE / 2, HOLE, HOLE);
		ctx.restore();
	}

	const bo = offsets(bx, by, BALL_R + 4);
	for (let i = 0; i < bo.length; i += 2) {
		ctx.beginPath();
		ctx.arc(bx + bo[i], by + bo[i + 1], BALL_R, 0, TAU);
		ctx.fillStyle = "#ffd166";
		ctx.fill();
		ctx.lineWidth = 1;
		ctx.strokeStyle = "#8a6d1f";
		ctx.stroke();
	}
}

function showStats() {
	const bv = Math.hypot(ball.vx, ball.vy);
	const sv = Math.hypot(sq.vx, sq.vy);
	const px = BALL_MASS * ball.vx + SQ_MASS * sq.vx;
	const py = BALL_MASS * ball.vy + SQ_MASS * sq.vy;
	const lines = [
		"ball |v| = " + bv.toFixed(6) + " px/s",
		"square1 |v| = " + sv.toFixed(6) + " px/s",
		"square1 omega = " + sq.va.toFixed(6) + " rad/s",
		"I = " + INERTIA.toFixed(6) + " kg*px^2",
		"E = " + energy().toFixed(6) + "   |p| = " + Math.hypot(px, py).toFixed(6)
	];
	stats.textContent = lines.join("\n");
}

function frame(now) {
	if (!last) last = now;
	let dt = (now - last) / 1000;
	last = now;
	if (dt > 0.25) dt = 0.25;
	acc += dt;
	let n = 0;
	while (acc >= DT && n++ < 60) {
		step(DT);
		acc -= DT;
	}
	if (ticks % 30 === 0) showStats();
	draw();
	requestAnimationFrame(frame);
}

toggle.addEventListener("change", () => {
	freeRot = toggle.checked;
	if (!freeRot) sq.va = 0;
	hint.textContent = freeRot
		? "on: free rotation + translation, I = m*(a^2+b^2)/6 for the square frame"
		: "off: rotation locked (spin energy absorbed), free translation";
});

window.addEventListener("resize", fit);
if (typeof ResizeObserver === "function") new ResizeObserver(fit).observe(canvas.parentElement);
fit();
requestAnimationFrame(frame);
</script>
</body>
</html>
