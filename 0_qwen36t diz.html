<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Wrap-Around Physics Simulation</title>
	<style>
		body { margin: 0; overflow: hidden; background: #111; }
		canvas { display: block; }
	</style>
</head>
<body>
	<canvas id="game"></canvas>
	<script>
		const canvas = document.getElementById('game');
		const ctx = canvas.getContext('2d');
		canvas.width = 1024;
		canvas.height = 1024;

		const WORLD_SIZE = 1024;

		function wrap(val, size) {
			return ((val % size) + size) % size;
		}

		const square = {
			x: 512 - 100,
			y: 512 - 100,
			w: 200,
			h: 200,
			vx: 2.4,
			vy: 1.7,
			mass: 1
		};

		const ball = {
			x: 512,
			y: 512,
			r: 5,
			vx: 3.0,
			vy: -2.5,
			mass: 1
		};

		function update() {
			square.x += square.vx;
			square.y += square.vy;
			square.x = wrap(square.x, WORLD_SIZE);
			square.y = wrap(square.y, WORLD_SIZE);

			ball.x += ball.vx;
			ball.y += ball.vy;

			const sqCenterX = square.x + square.w / 2;
			const sqCenterY = square.y + square.h / 2;

			let relX = ball.x - sqCenterX;
			let relY = ball.y - sqCenterY;

			if (relX > WORLD_SIZE / 2) relX -= WORLD_SIZE;
			else if (relX < -WORLD_SIZE / 2) relX += WORLD_SIZE;
			if (relY > WORLD_SIZE / 2) relY -= WORLD_SIZE;
			else if (relY < -WORLD_SIZE / 2) relY += WORLD_SIZE;

			const holeHalf = 50;
			const ballR = ball.r;

			if (relX + ballR > holeHalf) {
				ball.x = sqCenterX + holeHalf - ballR;
				ball.vx *= -1;
			} else if (relX - ballR < -holeHalf) {
				ball.x = sqCenterX - holeHalf + ballR;
				ball.vx *= -1;
			}

			if (relY + ballR > holeHalf) {
				ball.y = sqCenterY + holeHalf - ballR;
				ball.vy *= -1;
			} else if (relY - ballR < -holeHalf) {
				ball.y = sqCenterY - holeHalf + ballR;
				ball.vy *= -1;
			}

			ball.x = wrap(ball.x, WORLD_SIZE);
			ball.y = wrap(ball.y, WORLD_SIZE);
		}

		function draw() {
			ctx.fillStyle = '#0a0a0a';
			ctx.fillRect(0, 0, canvas.width, canvas.height);

			ctx.strokeStyle = '#4CAF50';
			ctx.lineWidth = 2;
			ctx.beginPath();
			ctx.rect(square.x, square.y, square.w, square.h);
			ctx.stroke();

			const holeX = square.x + (square.w - 100) / 2;
			const holeY = square.y + (square.h - 100) / 2;
			ctx.strokeStyle = '#8BC34A';
			ctx.beginPath();
			ctx.rect(holeX, holeY, 100, 100);
			ctx.stroke();

			ctx.fillStyle = '#FF5722';
			ctx.beginPath();
			ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
			ctx.fill();
		}

		function loop() {
			update();
			draw();
			requestAnimationFrame(loop);
		}

		loop();
	</script>
</body>
</html>
